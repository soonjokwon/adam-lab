# Sheet → committed JSON → main (GitHub Pages branch deploy).
# Browser never reads the Sheet. Actions uses Sheets API + a service account
# (repo secret GOOGLE_SERVICE_ACCOUNT_JSON). Share the private sheet Viewer
# with the SA email. Do not log or commit the key.
# Triggers: manual workflow_dispatch, or Apps Script on sheet change (external).
name: Snapshot sheet → Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-pages
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN; contents:write allows push back to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write Google SA credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then echo "Missing secrets.GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; fi
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Install snapshot dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-auth google-api-python-client

      - name: Snapshot sheet → data/*.json
        run: python3 scripts/snapshot_sheet.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ js/sheet/sheets.js
          if git diff --staged --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "data: refresh sheet snapshot"
          # Pages is Deploy-from-branch on main; push is enough (no actions/deploy-pages)
          git push origin HEAD:main
